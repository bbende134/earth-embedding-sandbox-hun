services:
  redis:
    image: redis:7.2
    container_name: redis-embeddings
    env_file:
      - ../.env
    ports:
      - "6379:6379"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 5s
      retries: 10
      start_period: 2s
      timeout: 1s 
      
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    env_file:
      - ../.env
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # MINIO_ADDRESS: minio
      # MINIO_PORT: 9000
      MQ_TYPE: woodpecker
    volumes:
      - ./milvus.yaml:/milvus/configs/milvus.yaml
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"

  api:
    # image: <REGION>-docker.pkg.dev/<PROJECT>/apps/geo-sim-api:latest
    build:
      context: ..       # directory where your FastAPI Dockerfile is
      dockerfile: infra/DockerfileApp
    container_name: geo-sim-api
    env_file:
      - ../.env
    depends_on:
      standalone:
        condition: service_healthy
    environment:
      REDIS_HOST: redis-embeddings
      MILVUS_HOST: standalone
      MILVUS_PORT: "19530"
      METRIC_TYPE: "IP"
    ports:
      - "8000:8000"
    restart: unless-stopped


networks:
  default:
    name: milvus